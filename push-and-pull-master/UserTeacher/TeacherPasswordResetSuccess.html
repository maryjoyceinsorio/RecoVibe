<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Teacher portal - Password reset complete</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TeacherForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="../UserStudent/Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Teacher Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card success-card">
          <div class="success-icon">&#10003;</div>
          <h2>Reset checks completed</h2>
          <p class="sub">
            The verification code and password requirements passed. This
            frontend has no account service connected, so no account password
            was changed.
          </p>
          <a
            href="TeacherLogin.html"
            class="btn-primary"
            style="display: block; text-align: center; text-decoration: none"
            >Back to Login</a
          >
        </section>
      </main>
    </div>
  </body>
</html>
