<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="google-calendar-api-key" content="YOUR_GOOGLE_CALENDAR_API_KEY" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Create Event · PUP Biñan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TeacherCreate.css" />
  </head>
  <body>
    <svg
      width="0"
      height="0"
      style="position: absolute"
      aria-hidden="true"
      focusable="false"
    >
      <symbol id="caret" viewBox="0 0 14 10">
        <path d="M0 0h14L7 10z" fill="currentColor" />
      </symbol>
    </svg>
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute; overflow: hidden"
    >
      <symbol id="teacher-icon-dashboard" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-events" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3" />
        </g>
      </symbol>
      <symbol id="teacher-icon-calendar" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-create" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="14" height="14" rx="2" />
          <path d="M10 6v8M6 10h8" />
        </g>
      </symbol>
      <symbol id="teacher-icon-my-events" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 4.5h12v11H4zM7 2.5v4M13 2.5v4M4 8h12M7 11h.1M10 11h.1M13 11h.1M7 14h.1M10 14h.1"
          />
        </g>
      </symbol>
      <symbol id="teacher-icon-notifications" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
          <path d="M8 16a2 2 0 0 0 4 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-profile" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="10" cy="6.5" r="3" />
          <path d="M4 17a6 6 0 0 1 12 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-logout" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8M13 13.5 17 10l-4-3.5M7.5 10H17"
          />
        </g>
      </symbol>
    </svg>

    <div class="organizer-app">
      <aside class="organizer-sidebar">
        <div class="organizer-brand">
          <span class="organizer-brand-mark">RV</span>
          <span class="organizer-brand-copy"
            ><strong>RecoVibe</strong><small>PUP Biñan Campus</small></span
          >
        </div>
        <nav class="nav" id="notificationNavigation" aria-label="Primary">
          <a class="nav-item" href="TeacherDashBoard.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-dashboard" /></svg></span
            ><span class="nav-label">Dashboard</span></a
          >
          <a class="nav-item" href="TeacherAllEvent.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-events" /></svg></span
            ><span class="nav-label">All Events</span></a
          >
          <a class="nav-item" href="TeacherCalendar.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-calendar" /></svg></span
            ><span class="nav-label">Calendar</span></a
          >
          <a class="nav-item is-active" href="TeacherCreate.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-create" /></svg></span
            ><span class="nav-label">Create Event</span></a
          >
          <a class="nav-item" href="TeacherMyEvent.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-my-events" /></svg></span
            ><span class="nav-label">My Events</span></a
          >
          <a class="nav-item" href="TeacherNotification.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-notifications" /></svg></span
            ><span class="nav-label">Notifications</span
            ><span class="nav-badge" id="navNotifBadge" hidden></span
          ></a>
          <a class="nav-item" href="TeacherProfile.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-profile" /></svg></span
            ><span class="nav-label">Profile</span></a
          >
        </nav>

        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="userAvatar">T</div>
            <div class="user-meta">
              <div class="user-name" id="userName">Teacher</div>
              <div class="user-role" id="userRole">Faculty account</div>
            </div>
          </div>
          <a class="nav-item logout" href="TeacherLogin.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-logout" /></svg></span
            ><span class="nav-label">Logout</span></a
          >
        </div>
      </aside>

      <main class="organizer-main">
        <div id="createEventRoot" aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="TeacherCreate.js"></script>
    <script src="TeacherNotification.js"></script>
  </body>
</html>
