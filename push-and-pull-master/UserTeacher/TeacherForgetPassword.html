<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Teacher portal - Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TeacherForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="../UserStudent/Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Teacher Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card">
          <a href="TeacherLogin.html" class="back-link">‹ Back to sign in</a>
          <h2>Reset your password</h2>
          <p class="sub">
            Enter the email on your teacher account and we'll send a 6-digit
            verification code.
          </p>
          <div class="field">
            <label for="school-email">Email</label
            ><input
              type="email"
              id="school-email"
              placeholder="Enter your email address"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              aria-describedby="forgot-status"
              maxlength="254"
              required
            />
          </div>
          <p
            class="match-message"
            id="forgot-status"
            role="status"
            aria-live="polite"
          ></p>
          <button type="button" class="btn-primary" id="send-code">
            Send code
          </button>
        </section>
      </main>
    </div>
    <script src="TeacherForgotPassword.js"></script>
  </body>
</html>
