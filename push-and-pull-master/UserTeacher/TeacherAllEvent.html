<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe - Teacher Events</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TeacherAllEvent.css" />
  </head>
  <body>
    <svg
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      style="position: absolute; overflow: hidden"
    >
      <symbol id="teacher-icon-dashboard" viewBox="0 0 20 20">
        <g fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
          <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
          <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-events" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3" />
        </g>
      </symbol>
      <symbol id="teacher-icon-calendar" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
          <path d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1" />
        </g>
      </symbol>
      <symbol id="teacher-icon-create" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="14" height="14" rx="2" />
          <path d="M10 6v8M6 10h8" />
        </g>
      </symbol>
      <symbol id="teacher-icon-my-events" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 4.5h12v11H4zM7 2.5v4M13 2.5v4M4 8h12M7 11h.1M10 11h.1M13 11h.1M7 14h.1M10 14h.1"
          />
        </g>
      </symbol>
      <symbol id="teacher-icon-notifications" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
          <path d="M8 16a2 2 0 0 0 4 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-profile" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="10" cy="6.5" r="3" />
          <path d="M4 17a6 6 0 0 1 12 0" />
        </g>
      </symbol>
      <symbol id="teacher-icon-logout" viewBox="0 0 20 20">
        <g
          fill="none"
          stroke="currentColor"
          stroke-width="1.4"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8M13 13.5 17 10l-4-3.5M7.5 10H17"
          />
        </g>
      </symbol>
    </svg>
    <div class="teacher-app" id="teacherEventsPage">
      <aside class="teacher-sidebar" id="teacherSidebar">
        <div class="teacher-sidebar-top">
          <a
            class="teacher-brand"
            id="teacherBrandLink"
            aria-label="RecoVibe teacher dashboard"
          >
            <span class="teacher-brand-mark" id="teacherBrandMark">RV</span>
            <span class="teacher-brand-copy" id="teacherBrandCopy"
              ><strong id="teacherBrandName">RecoVibe</strong
              ><small id="teacherBrandCampus">PUP Biñan Campus</small></span
            >
          </a>
          <button
            type="button"
            class="teacher-menu-toggle"
            id="teacherMenuToggle"
            aria-label="Open navigation"
            aria-expanded="false"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
        <nav
          class="teacher-nav"
          id="teacherNavigation"
          aria-label="Teacher navigation"
        >
          <a
            class="teacher-nav-item"
            id="teacherDashboardNav"
            href="TeacherDashBoard.html"
            ><span class="nav-icon" aria-hidden="true"
              ><svg viewBox="0 0 20 20">
                <use href="#teacher-icon-dashboard" /></svg></span
            ><span>Dashboard</span></a
          >
          <a
            class="teacher-nav-item is-active"
            id="teacherAllEventsNav"
            href="TeacherAllEvent.html"
            ><span
              class="nav-icon"
              id="teacherAllEventsNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-events" /></svg></span
            ><span id="teacherAllEventsNavLabel">All Events</span></a
          >
          <a
            class="teacher-nav-item"
            id="teacherCalendarNav"
            href="TeacherCalendar.html"
            ><span
              class="nav-icon"
              id="teacherCalendarNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-calendar" /></svg></span
            ><span id="teacherCalendarNavLabel">Calendar</span></a
          >
          <a
            class="teacher-nav-item"
            id="teacherCreateEventNav"
            href="TeacherCreate.html"
            ><span
              class="nav-icon"
              id="teacherCreateEventNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-create" /></svg></span
            ><span id="teacherCreateEventNavLabel">Create Event</span></a
          >
          <a
            class="teacher-nav-item"
            id="teacherMyEventsNav"
            href="TeacherMyEvent.html"
            ><span
              class="nav-icon"
              id="teacherMyEventsNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-my-events" /></svg></span
            ><span id="teacherMyEventsNavLabel">My Events</span></a
          >
          <a
            class="teacher-nav-item"
            id="teacherNotificationsNav"
            href="TeacherNotification.html"
            ><span
              class="nav-icon"
              id="teacherNotificationsNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-notifications" /></svg></span
            ><span id="teacherNotificationsNavLabel">Notifications</span
            ><span class="nav-badge" id="navNotifBadge" hidden></span
          ></a>
          <a
            class="teacher-nav-item"
            id="teacherProfileNav"
            href="TeacherProfile.html"
            ><span
              class="nav-icon"
              id="teacherProfileNavIcon"
              aria-hidden="true"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <use href="#teacher-icon-profile" /></svg></span
            ><span id="teacherProfileNavLabel">Profile</span></a
          >
        </nav>
        <div class="sidebar-bottom teacher-sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="teacherAvatar">T</div>
            <div class="user-meta">
              <div class="user-name" id="teacherName">Teacher</div>
              <div class="user-role" id="teacherRole">Faculty account</div>
            </div>
          </div>
          <a
            class="nav-item logout"
            href="TeacherLogin.html"
            id="teacherLogout"
            title="Logout"
          >
            <span class="nav-icon"
              ><svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <use href="#teacher-icon-logout" /></svg
            ></span>
            <span class="nav-label">Logout</span>
          </a>
        </div>
      </aside>

      <main class="teacher-main">
        <section class="teacher-toolbar" aria-label="Event filters">
          <label
            class="teacher-search"
            id="teacherSearchBox"
            for="teacherEventSearch"
            ><span id="teacherSearchIcon" aria-hidden="true"
              ><svg viewBox="0 0 20 20" fill="none">
                <circle
                  cx="8.8"
                  cy="8.8"
                  r="5.6"
                  stroke="currentColor"
                  stroke-width="1.5"
                />
                <path
                  d="M13 13l4 4"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                /></svg></span
            ><input
              id="teacherEventSearch"
              type="search"
              placeholder="PUP Connect!"
              autocomplete="off"
          /></label>
          <select id="teacherEventTypeFilter" aria-label="Filter by event type">
            <option value="all">All Events</option>
            <option value="campus">Campus Events</option>
            <option value="organization">Organization Events</option>
          </select>
          <select id="teacherSourceFilter" aria-label="Filter by event source">
            <option value="all">All Sources</option>
            <option value="PUP Official">PUP Official</option>
            <option value="PUP Biñan">PUP Biñan</option>
            <option value="PUP Biñan Campus">PUP Biñan Campus</option>
            <option value="PUP CITE">PUP CITE</option>
            <option value="IBITS">IBITS</option>
            <option value="Organizational">Organizational</option>
            <option value="Event Organizer">Event Organizer</option>
          </select>
          <select id="teacherCategoryFilter" aria-label="Filter by category">
            <option value="all">Category</option>
            <option value="Academic">Academic &amp; Learning</option>
            <option value="Arts">Arts &amp; Culture</option>
            <option value="Leadership &amp; Career">
              Leadership &amp; Career
            </option>
            <option value="Sports">Sports &amp; Wellness</option>
            <option value="Tech">Tech &amp; Innovation</option>
          </select>
          <select id="teacherDateFilter" aria-label="Filter by date">
            <option value="all">All Dates</option>
            <option value="today">Today</option>
            <option value="week">This Week</option>
            <option value="month">This Month</option>
            <option value="upcoming">Upcoming</option>
            <option value="past">Past Events</option>
          </select>
          <select id="teacherStatusFilter" aria-label="Filter by event status">
            <option value="all">Event Status</option>
            <option value="Available to Join">Available to Join</option>
            <option value="Registration Closed">Registration Closed</option>
            <option value="Pending">Pending</option>
            <option value="Approved">Approved</option>
            <option value="Published">Published</option>
            <option value="Rejected">Rejected</option>
            <option value="Cancelled">Cancelled</option>
          </select>
          <select
            id="teacherAvailabilityFilter"
            aria-label="Filter by availability"
          >
            <option value="all">Availability</option>
            <option value="available">Available</option>
            <option value="full">Full</option>
          </select>
        </section>

        <section
          class="teacher-events-section"
          aria-labelledby="teacherCurrentHeadingText"
        >
          <div class="teacher-results-bar" id="teacherCurrentHeading">
            <h2 id="teacherCurrentHeadingText">Events Happening Now</h2>
          </div>
          <section
            class="teacher-event-list"
            id="teacherCurrentEvents"
            aria-live="polite"
          ></section>
        </section>

        <section
          class="teacher-events-section teacher-all-events-section"
          aria-labelledby="teacherAllEventsHeadingText"
        >
          <div class="teacher-results-bar">
            <h2 id="teacherAllEventsHeadingText">All Events</h2>
            <span id="teacherResultCount"></span>
          </div>
          <section
            class="teacher-event-list"
            id="teacherUpcomingEvents"
            aria-live="polite"
          ></section>
        </section>
      </main>
    </div>

    <div
      class="teacher-modal-overlay event-detail-overlay"
      id="teacherEventOverlay"
      hidden
    >
      <article
        class="teacher-modal event-detail-reference"
        role="dialog"
        aria-modal="true"
        aria-labelledby="teacherModalTitle"
      >
        <button
          type="button"
          class="teacher-modal-close"
          id="teacherModalClose"
          aria-label="Close event details"
        >
          &times;
        </button>
        <p class="teacher-modal-source" id="teacherModalSource"></p>
        <h2 id="teacherModalTitle"></h2>
        <div class="teacher-modal-meta" id="teacherModalMeta">
          <span id="teacherModalDate"></span><span id="teacherModalTime"></span
          ><span id="teacherModalLocation"></span>
        </div>
        <p class="teacher-modal-description" id="teacherModalDescription"></p>
        <div class="teacher-modal-grid" id="teacherModalGrid">
          <div id="teacherModalCategoryField">
            <strong id="teacherModalCategoryLabel">Category</strong
            ><span id="teacherModalCategory"></span>
          </div>
          <div id="teacherModalCapacityField">
            <strong id="teacherModalCapacityLabel">Capacity</strong
            ><span id="teacherModalCapacity"></span>
          </div>
          <div id="teacherModalStatusField">
            <strong id="teacherModalStatusLabel">Registration</strong
            ><span id="teacherModalStatus"></span>
          </div>
        </div>
      </article>
    </div>

    <script src="../UserStudent/events-data.js"></script>
    <script src="../EventDetailsModal.js"></script>
    <script src="TeacherAllEvent.js"></script>
    <script src="TeacherNotification.js"></script>
  </body>
</html>
