<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe — Notifications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Notification.css" />
  </head>
  <body>
    <div class="app" id="notificationPage">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark">RV</div>
            <div class="brand-text">
              <div class="brand-name">RecoVibe</div>
              <div class="brand-sub">PUP Biñan Campus</div>
            </div>
          </div>
        </div>

        <nav class="nav" id="NotificationNavigation" aria-label="Primary">
          <a class="nav-item" href="Dashboard.html" title="Dashboard"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
                <rect
                  x="11.5"
                  y="11.5"
                  width="6"
                  height="6"
                  rx="1"
                /></svg></span
            ><span class="nav-label">Dashboard</span></a
          >
          <a class="nav-item" href="Events.html" title="Events"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path d="M2.5 8h15M6 2.5v3M14 2.5v3" /></svg></span
            ><span class="nav-label">Events</span></a
          >
          <a class="nav-item" href="Calendar.html" title="Calendar"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path
                  d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1"
                /></svg></span
            ><span class="nav-label">Calendar</span></a
          >
          <a
            class="nav-item"
            href="Student-Participation.html"
            title="My Participation"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="7" cy="6" r="2.5" />
                <path
                  d="M2.8 16a4.2 4.2 0 0 1 8.4 0M12.5 9a2.3 2.3 0 1 0 0-4.5M13 11.5a4 4 0 0 1 4.2 4.5"
                /></svg></span
            ><span class="nav-label">My Participation</span></a
          >
          <a
            class="nav-item is-active"
            href="Notification.html"
            title="Notifications"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
                <path d="M8 16a2 2 0 0 0 4 0" /></svg></span
            ><span class="nav-label">Notifications</span
            ><span class="nav-badge" id="navNotifBadge"></span
          ></a>
          <a
            class="nav-item"
            href="StudentProfile.html"
            title="Profile"
            aria-current="page"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="6.5" r="3" />
                <path d="M4 17a6 6 0 0 1 12 0" /></svg></span
            ><span class="nav-label">Profile</span></a
          >
        </nav>

        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="userAvatar"></div>
            <div class="user-meta">
              <div class="user-name" id="userName"></div>
              <div class="user-role" id="userRole"></div>
            </div>
          </div>
          <a class="nav-item logout" href="StudentLogin.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" fill="none">
                <path
                  d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8M13 13.5 17 10l-4-3.5M7.5 10H17"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            ><span class="nav-label">Logout</span></a
          >
        </div>
      </aside>

      <main class="main" id="notificationMain">
        <section
          class="notification-toolbar"
          id="notificationFilterSection"
          aria-label="Notification controls"
        >
          <div class="search-box">
            <svg
              width="16"
              height="16"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="8.8"
                cy="8.8"
                r="5.6"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M13 13l4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              /></svg
            ><input
              id="notificationSearch"
              type="search"
              placeholder="PUP Connect!"
              aria-label="Search notifications"
            />
          </div>
          <label class="filter-select-wrap" for="notificationFilter"
            >Filter notifications
            <select id="notificationFilter" class="filter-select">
              <option value="all">All Notifs</option>
              <option value="unread">Unread</option>
              <option value="read">Read</option>
            </select>
          </label>
        </section>

        <div id="notificationPanels" data-panel-owner="notifications">
          <div
            class="notification-panel-switcher"
            aria-label="Notification panel controls"
          >
            <button
              id="showDeletedNotifications"
              class="trash-bin-link"
              type="button"
              aria-pressed="false"
            >
              <svg
                id="showDeletedNotificationsIcon"
                viewBox="0 0 20 20"
                fill="none"
                aria-hidden="true"
              >
                <path
                  d="M4 6h12M8 6V4.5h4V6m-6.5 0 .7 10h7.6l.7-10M8.5 9v4m3-4v4"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg
              ><span id="showDeletedNotificationsLabel">Recently Deleted</span>
            </button>
            <button id="markAllRead" class="mark-all" type="button">
              Mark All As Read
            </button>
          </div>
          <section
            class="notifications-panel"
            id="allNotificationsPanel"
            aria-labelledby="allNotificationsHeading"
          >
            <div class="panel-heading">
              <h2 id="allNotificationsHeading">All Notifications</h2>
            </div>
            <div
              id="notificationList"
              class="notification-list"
              aria-live="polite"
            ></div>
          </section>

          <section
            class="notifications-panel deleted-notifications-panel"
            id="deletedNotificationsPanel"
            aria-labelledby="deletedNotificationsHeading"
          >
            <div class="panel-heading">
              <h2 id="deletedNotificationsHeading" tabindex="-1">
                Recently Deleted
              </h2>
            </div>
            <div
              id="deletedNotificationList"
              class="notification-list"
              aria-live="polite"
            ></div>
          </section>
        </div>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div
      class="notification-modal-overlay"
      id="notificationModalOverlay"
      hidden
    >
      <section
        class="notification-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="notificationModalTitle"
        data-notification-record
      >
        <button
          type="button"
          class="notification-modal-close"
          id="notificationModalClose"
          aria-label="Close notification details"
        >
          &times;
        </button>
        <h2 id="notificationModalTitle" data-notification-field="title"></h2>
        <p
          class="notification-modal-from"
          id="notificationModalFrom"
          data-notification-field="from"
        ></p>
        <div
          class="notification-modal-time"
          id="notificationModalTime"
          data-notification-field="time"
        ></div>
        <p
          class="notification-modal-message"
          id="notificationModalMessage"
          data-notification-field="message"
        ></p>
        <div
          class="notification-modal-reason"
          id="notificationModalReason"
          hidden
        ></div>
        <div
          class="notification-modal-event"
          id="notificationModalEvent"
          hidden
        >
          <div>
            <strong>Location</strong
            ><span id="notificationEventLocation"></span>
          </div>
          <div>
            <strong>Time</strong><span id="notificationEventTime"></span>
          </div>
          <div>
            <strong>Room</strong><span id="notificationEventRoom"></span>
          </div>
          <div>
            <strong>Availability</strong
            ><span id="notificationEventSlots"></span>
          </div>
        </div>
        <button
          class="btn-primary notification-view-event"
          id="notificationViewEvent"
          hidden
        >
          View Event Details
        </button>
      </section>
    </div>
    <div class="notification-modal-overlay" id="deleteConfirmOverlay" hidden>
      <section
        class="notification-modal delete-confirm-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="deleteConfirmTitle"
      >
        <button
          type="button"
          class="notification-modal-close"
          id="deleteConfirmClose"
          aria-label="Close delete confirmation"
        >
          &times;
        </button>
        <h2 id="deleteConfirmTitle">Delete Notification?</h2>
        <p>It will be moved to Recently Deleted for 7 days.</p>
        <div class="delete-confirm-actions">
          <button
            class="btn-primary"
            id="confirmDeleteNotification"
            type="button"
          >
            Delete
          </button>
          <button
            class="delete-cancel"
            id="cancelDeleteNotification"
            type="button"
          >
            Cancel
          </button>
        </div>
      </section>
    </div>
    <script src="notification-count.js"></script>
    <script src="events-data.js"></script>
    <script>
      (() => {
        let user = {};
        try {
          user = JSON.parse(localStorage.getItem("recovibeCurrentUser") || "null") || {};
        } catch {
          user = {};
        }
        const firstName = String(user.firstName || "").trim();
        const fullName = String(user.name || user.fullName || "").trim();
        const nameFromProfile = [firstName, user.middleName, user.lastName]
          .map((part) => String(part || "").trim())
          .filter(Boolean)
          .join(" ");
        const displayName = fullName || nameFromProfile || "Student";
        const first = firstName || fullName.split(/\s+/).filter(Boolean)[0] || "";
        const fallback = [
          user.username,
          user.studentNumber,
          user.studentId,
          user.email,
        ]
          .map((value) => String(value || "").trim())
          .find(Boolean) || "";
        const avatar = Array.from(first || fallback)[0]?.toLocaleUpperCase() || "S";
        const organization = String(user.organization || "").trim();
        const role =
          organization && organization.toLowerCase() !== "none"
            ? organization
            : "Student";
        document.querySelectorAll(".user-name").forEach((item) => item.textContent = displayName);
        document.querySelectorAll(".user-role").forEach((item) => item.textContent = role);
        document.querySelectorAll(".avatar").forEach((item) => item.textContent = avatar);
        document.querySelectorAll("#userFirstName").forEach((item) => item.textContent = first);
        const greeting = document.getElementById("dashboardGreeting");
        if (greeting) {
          const hour = new Date().getHours();
          const salutation = hour < 12 ? "Good Morning" : hour < 18 ? "Good Noon" : "Good Evening";
          greeting.textContent = `${salutation}, ${displayName}`;
        }
      })();
    </script>
    <script src="../EventDetailsModal.js"></script>
    <script src="Notification.js"></script>
  </body>
</html>
