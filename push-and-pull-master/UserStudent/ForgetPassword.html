<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student portal — Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ForgetPassword.css" />
  </head>
  <body>
    <div class="screen" id="forgotPasswordPage">
      <div class="side" id="forgotPasswordBrandPanel">
        <img
          id="forgotPasswordBrandLogo"
          src="Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1 id="forgotPasswordPageTitle">RecoVibe Student Portal</h1>
          <p class="tagline" id="forgotPasswordPageTagline">
            University, Organization, and Seminar Events.
          </p>
        </div>
      </div>

      <div class="main" id="forgotPasswordMain">
        <div class="card" id="forgotPasswordCard">
          <!-- Password reset is completed securely through Firebase's email link. -->
          <div class="view active" id="view-forgot">
            <a href="StudentLogin.html" class="back-link">‹ Back to sign in</a>
            <h2 id="forgotPasswordHeading">Reset your password</h2>
            <p class="sub" id="forgotPasswordDescription">
              Enter the email on your student account and we'll send a secure
              password reset link.
            </p>

            <form data-password-reset-form novalidate>
              <div class="field" id="field-forgot-email">
                <label for="forgot-email">Email</label>
                <input
                  type="email"
                  id="forgot-email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  inputmode="email"
                  autocapitalize="none"
                  spellcheck="false"
                  required
                  maxlength="254"
                  aria-describedby="forgot-email-error"
                />
                <div class="error-msg" id="forgot-email-error"></div>
              </div>
              <p class="sub" data-reset-status role="status" aria-live="polite"></p>
              <button class="btn-primary" type="submit">Send reset link</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="password-reset-request.js"></script>
  </body>
</html>
