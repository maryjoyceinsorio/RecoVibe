<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe — PUP Biñan Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Dashboard.css" />
  </head>
  <body>
    <div class="app" id="dashboardPage">
      <!-- ============ SIDEBAR ============ -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark">RV</div>
            <div class="brand-text">
              <div class="brand-name">RecoVibe</div>
              <div class="brand-sub">PUP Biñan Campus</div>
            </div>
          </div>
        </div>

        <nav class="nav" id="eventsNavigation" aria-label="Primary">
          <a class="nav-item is-active" href="Dashboard.html" title="Dashboard" aria-current="page"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
                <rect
                  x="11.5"
                  y="11.5"
                  width="6"
                  height="6"
                  rx="1"
                /></svg></span
            ><span class="nav-label">Dashboard</span></a
          >
          <a class="nav-item" href="Events.html" title="Events"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path d="M2.5 8h15M6 2.5v3M14 2.5v3" /></svg></span
            ><span class="nav-label">Events</span></a
          >
          <a class="nav-item" href="Calendar.html" title="Calendar"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path
                  d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1"
                /></svg></span
            ><span class="nav-label">Calendar</span></a
          >
          <a
            class="nav-item"
            href="Student-Participation.html"
            title="My Participation"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="7" cy="6" r="2.5" />
                <path
                  d="M2.8 16a4.2 4.2 0 0 1 8.4 0M12.5 9a2.3 2.3 0 1 0 0-4.5M13 11.5a4 4 0 0 1 4.2 4.5"
                /></svg></span
            ><span class="nav-label">My Participation</span></a
          >
          <a class="nav-item" href="Notification.html" title="Notifications"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
                <path d="M8 16a2 2 0 0 0 4 0" /></svg></span
            ><span class="nav-label">Notifications</span
            ><span class="nav-badge" id="navNotifBadge"></span
          ></a>
          <a
            class="nav-item"
            href="StudentProfile.html"
            title="Profile"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="6.5" r="3" />
                <path d="M4 17a6 6 0 0 1 12 0" /></svg></span
            ><span class="nav-label">Profile</span></a
          >
        </nav>

        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="userAvatar"></div>
            <div class="user-meta">
              <div class="user-name" id="userName"></div>
              <div class="user-role" id="userRole"></div>
            </div>
          </div>
          <a
            class="nav-item logout"
            href="StudentLogin.html"
            data-label="Logout"
            title="Logout"
          >
            <span class="nav-icon">
              <svg viewBox="0 0 20 20" fill="none">
                <path
                  d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
                <path
                  d="M13 13.5 17 10l-4-3.5"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M7.5 10H17"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="nav-label">Logout</span>
          </a>
        </div>
      </aside>

      <!-- ============ MAIN ============ -->
      <main class="main" id="dashboardMain">
        <header class="topbar" id="dashboardHeader">
          <div>
            <h1 class="greeting" id="dashboardGreeting">
              Good Morning, <span id="greetingName">Student</span>
            </h1>
          </div>
          <div class="today">
            <div class="today-label">Today</div>
            <div class="today-date" id="todayDate"></div>
          </div>
        </header>

        <section
          class="recommendations-overview"
          id="recommendationsSection"
          aria-labelledby="recommendationsHeading"
        >
          <div class="panel-head">
            <h2 id="recommendationsHeading">Recommended for you</h2>
            <span class="hint-label">Based on your preferences · <a href="StudentProfile.html#preferencesPanel" class="link-edit-pref" id="editPreferencesLink">Edit</a></span>
          </div>
          <div class="rec-grid" id="recGrid"><!-- injected by JS --></div>
        </section>

        <section
          class="search-row"
          id="dashboardSearchSection"
          aria-label="Event search"
        >
          <div class="search-box">
            <svg
              width="16"
              height="16"
              viewBox="0 0 20 20"
              fill="none"
              class="search-icon"
              aria-hidden="true"
            >
              <circle
                cx="8.8"
                cy="8.8"
                r="5.6"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M13 13l4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="PUP Connect!"
              aria-label="Search events"
            />
          </div>
        </section>

        <section class="content-grid" id="dashboardContent">
          <!-- 1. HAPPENING NOW (New section) -->
          <div class="content-col content-happening" id="happeningNowColumn">
            <div class="panel-head">
              <div class="panel-title-wrap">
                <h2 id="happeningHeading">Happening now</h2>
                <span class="live-count-badge" id="happeningLiveBadge" hidden>0 live</span>
              </div>
            </div>
            <div class="event-list" id="happeningNowList" aria-labelledby="happeningHeading"><!-- injected by JS --></div>
          </div>

          <!-- 2. UPCOMING EVENTS -->
          <div class="content-col content-upcoming" id="upcomingEventsColumn">
            <div class="panel-head">
              <h2 id="upcomingHeading">Upcoming events</h2>
              <a href="Events.html" class="link-see-all" data-view="events" id="seeAllEventsLink">See all events</a>
            </div>
            <div class="event-list" id="upcomingEventsList" aria-labelledby="upcomingHeading"><!-- injected by JS --></div>
          </div>

          <!-- 3. CALENDAR PREVIEW -->
          <div class="content-col content-calendar" id="calendarColumn">
            <div class="card calendar-card" id="dashboardCalendarCard">
              <div class="panel-head panel-head--tight">
                <h2 id="calendarHeading">Calendar preview</h2>
                <a href="Calendar.html" class="link-see-all" data-view="calendar" id="fullCalendarLink">Full calendar</a>
              </div>
              <div class="cal-nav">
                <button
                  type="button"
                  class="cal-arrow"
                  id="calPrev"
                  aria-label="Previous month"
                >
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path
                      d="M10 3L5 8l5 5"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <div class="cal-month" id="calMonthLabel"></div>
                <button
                  type="button"
                  class="cal-arrow"
                  id="calNext"
                  aria-label="Next month"
                >
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                    <path
                      d="M6 3l5 5-5 5"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
              <div class="cal-grid cal-grid--dow" aria-hidden="true">
                <span>S</span><span>M</span><span>T</span><span>W</span><span>Th</span><span>F</span><span>S</span>
              </div>
              <div class="cal-grid" id="calDays" role="grid" aria-label="Calendar month days"><!-- injected by JS --></div>
              <div class="cal-day-events" id="calDayEvents" aria-live="polite"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Live announcer for polite accessibility status updates -->
    <div id="dashboardLiveAnnouncer" class="sr-only" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="events-data.js"></script>
    <script src="notification-count.js"></script>
    <script type="module" src="Dashboard.js"></script>
  </body>
</html>
