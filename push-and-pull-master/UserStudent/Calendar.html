          <a

        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar" id="userAvatar">JL</div>
            <div class="user-meta">

              <div class="user-role" id="userRole">
                IBITS &nbsp;|&nbsp; BSIT 2-3 Ladderized
              </div>
            </div>
          </div>
          <a

      </aside>

      <main class="main" id="calendarMain">
        <div class="calendar-layout">
          <section class="calendar-page" id="calendarSection">
            <div class="cal-nav" id="calendarToolbar">
              <div class="cal-left-controls">
                <select
                  id="calMonthSelect"
                  class="cal-select"
                  aria-label="Select month"
                ></select>
                <select
                  id="calYearSelect"
                  class="cal-year-select"
                  aria-label="Select year"
                ></select>
              </div>
              <div class="cal-center-controls">
                <button class="cal-toggle" type="button">Today</button>
                <button
                  class="cal-arrow"
                  id="calFullPrev"
                  aria-label="Previous month"
                  type="button"
                >
                  &larr;
                </button>
                <button
                  class="cal-arrow"
                  id="calFullNext"
                  aria-label="Next month"
                  type="button"
                >
                  &rarr;
                </button>
              </div>
              <div class="cal-right-controls">
                <button
                  class="cal-mode is-active"
                  id="calendarMonthMode"
                  type="button"
                  aria-pressed="true"
                >
                  Month
                </button>
                <button
                  class="cal-mode"
                  id="calendarListMode"
                  type="button"
                  aria-pressed="false"
                >
                  List
                </button>
              </div>
            </div>

            <div class="cal-grid cal-grid--dow">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span
              ><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="cal-grid cal-grid--full" id="calFullDays"></div>
            <div class="calendar-list-view" id="calendarListView" hidden></div>

          </section>

          <aside class="calendar-side">
            <section class="calendar-side-panel upcoming-panel">
              <h3>Upcoming</h3>
            </section>

            <section class="calendar-side-panel filter-panel">
              <div class="panel-header">
                <h3>Filter by category</h3>
                <button type="button" class="filter-reset">Reset</button>
              </div>
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="PUP Official"
                /><span>PUP Official</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="PUP Biñan Campus"
                /><span>PUP Biñan</span></label
              >
              <label class="filter-option"
                ><input type="checkbox" checked data-source="PUP CITE" /><span
                  >PUP CITE</span
                ></label
              >
              <label class="filter-option"
                ><input type="checkbox" checked data-source="IBITS" /><span
                  >IBITS</span
                ></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Teachers/Faculty"
                /><span>Teachers/Faculty</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Others/External"
                /><span>Others/External</span></label
              >
            </section>
          </aside>
        </div>
      </main>
    </div>

    <div class="modal-overlay event-detail-overlay" id="organizerModalOverlay">
      <article
        class="modal event-detail-reference"
        role="dialog"
        aria-modal="true"
        aria-labelledby="organizerModalTitle"
      >
        <button
          class="modal-close"
          id="organizerModalClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-tag" id="organizerModalTag"></div>
        <h3 id="organizerModalTitle"></h3>
        <p class="modal-row" id="organizerModalDate"></p>
        <p class="modal-row" id="organizerModalTime"></p>
        <p class="modal-row" id="organizerModalLocation"></p>
        <p class="modal-desc" id="organizerModalDescription"></p>
        <div class="modal-foot">
          <span class="modal-slots" id="organizerModalSlots"></span>
          <a class="btn-primary" id="organizerModalEdit" href="Events.html"
            >View Event</a
          >
        </div>
      </article>
    </div>

    <div class="modal-overlay" id="organizerDayOverlay">
      <article
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="organizerDayTitle"
      >
        <button
          class="modal-close"
          id="organizerDayClose"
          type="button"
          aria-label="Close"
        >
          &times;
        </button>
        <h3 id="organizerDayTitle"></h3>
        <div class="day-modal-list" id="organizerDayList"></div>
      </article>
    </div>

    <div class="toast" id="toast"></div>

    <script src="events-data.js"></script>
    <script src="notification-count.js"></script>
    <script src="student-sidebar-profile.js"></script>
    <script src="../EventDetailsModal.js"></script>
    <script src="Calendar.js"></script>
  </body>
</html>
