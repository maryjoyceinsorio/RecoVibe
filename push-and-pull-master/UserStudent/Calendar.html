      <main class="main" id="calendarMain">
        <div class="calendar-layout">
          <section class="calendar-page" id="calendarSection">
            <div class="cal-nav" id="calendarToolbar">
              <div class="cal-left-controls">
                <select
                  id="calMonthSelect"
                  class="cal-select"
                  aria-label="Select month"
                ></select>
                <select
                  id="calYearSelect"
                  class="cal-year-select"
                  aria-label="Select year"
                ></select>
              </div>
              <div class="cal-center-controls">
                <button class="cal-toggle" type="button">Today</button>
                <button
                  class="cal-arrow"
                  id="calFullPrev"
                  aria-label="Previous month"
                  type="button"
                >
                  &larr;
                </button>
                <button
                  class="cal-arrow"
                  id="calFullNext"
                  aria-label="Next month"
                  type="button"
                >
                  &rarr;
                </button>
              </div>
            </div>

            <div class="cal-grid cal-grid--dow">
              <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span
              ><span>Thu</span><span>Fri</span><span>Sat</span>
            </div>
            <div class="cal-grid cal-grid--full" id="calFullDays"></div>

          </section>

          <aside class="calendar-side">
            <section class="calendar-side-panel upcoming-panel">
              <h3>Upcoming</h3>
            </section>

            <section class="calendar-side-panel filter-panel">
              <div class="panel-header">
                <h3>Filter by category</h3>
                <button type="button" class="filter-reset">Reset</button>
              </div>
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="PUP Official"
                /><span>PUP Official</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="PUP Biñan Campus"
                /><span>PUP Biñan</span></label
              >
              <label class="filter-option"
                ><input type="checkbox" checked data-source="CSC" /><span
                  >CSC</span
                ></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Organizational"
                /><span>Organizational</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Teachers/Faculty"
                /><span>Teachers/Faculty</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Others/External"
                /><span>Others/External</span></label
              >
              <label class="filter-option"
                ><input
                  type="checkbox"
                  checked
                  data-source="Holiday"
                /><span>Holiday</span></label
              >
            </section>
            <section

              id="calendarLegend"
              data-calendar-legend="student"
              aria-label="Calendar legend"

        role="dialog"
        aria-modal="true"
        aria-labelledby="organizerModalTitle"

          id="organizerModalClose"
          type="button"
          aria-label="Close"

          &times;
        </button>
        <div class="modal-tag" id="organizerModalTag"></div>
        <h3 id="organizerModalTitle"></h3>
        <p class="modal-row" id="organizerModalDate"></p>
        <p class="modal-row" id="organizerModalTime"></p>
        <p class="modal-row" id="organizerModalLocation"></p>
        <p class="modal-desc" id="organizerModalDescription"></p>
        <div class="modal-foot">
          <span class="modal-slots" id="organizerModalSlots"></span>
          <a class="btn-primary" id="organizerModalEdit" href="Events.html"

          >
        </div>
      </article>
    </div>

    <div class="modal-overlay" id="organizerDayOverlay">
      <article
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="organizerDayTitle"

          class="modal-close"
          id="organizerDayClose"
          type="button"
          aria-label="Close"

    <script>
      (() => {
        let user = {};
        try {
          user = JSON.parse(localStorage.getItem("recovibeCurrentUser") || "null") || {};
        } catch {
          user = {};
        }
        const firstName = String(user.firstName || "").trim();
        const fullName = String(user.name || user.fullName || "").trim();
        const nameFromProfile = [firstName, user.middleName, user.lastName]
          .map((part) => String(part || "").trim())
          .filter(Boolean)
          .join(" ");
        const displayName = fullName || nameFromProfile || "Student";
        const first = firstName || fullName.split(/\s+/).filter(Boolean)[0] || "";
        const fallback = [
          user.username,
          user.studentNumber,
          user.studentId,
          user.email,
        ]
          .map((value) => String(value || "").trim())
          .find(Boolean) || "";
        const avatar = Array.from(first || fallback)[0]?.toLocaleUpperCase() || "S";
        const organization = String(user.organization || "").trim();
        const role =
          organization && organization.toLowerCase() !== "none"
            ? organization
            : "Student";
        document.querySelectorAll(".user-name").forEach((item) => item.textContent = displayName);
        document.querySelectorAll(".user-role").forEach((item) => item.textContent = role);
        document.querySelectorAll(".avatar").forEach((item) => item.textContent = avatar);
        document.querySelectorAll("#userFirstName").forEach((item) => item.textContent = first);
        const greeting = document.getElementById("dashboardGreeting");
        if (greeting) {
          const hour = new Date().getHours();
          const salutation = hour < 12 ? "Good Morning" : hour < 18 ? "Good Noon" : "Good Evening";
          greeting.textContent = `${salutation}, ${displayName}`;
        }
      })();
    </script>
