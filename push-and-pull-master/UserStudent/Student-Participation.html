<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe — My Participation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Student-Participation.css" />
  </head>
  <body>
    <div class="app" id="participationPage">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark">RV</div>
            <div class="brand-text">
              <div class="brand-name">RecoVibe</div>
              <div class="brand-sub">PUP Biñan Campus</div>
            </div>
          </div>
        </div>
        <nav class="nav" id="ParticipationNavigation" aria-label="Primary">
          <a class="nav-item" href="Dashboard.html" title="Dashboard"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
                <rect
                  x="11.5"
                  y="11.5"
                  width="6"
                  height="6"
                  rx="1"
                /></svg></span
            ><span class="nav-label">Dashboard</span></a
          >
          <a class="nav-item" href="Events.html" title="Events"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path d="M2.5 8h15M6 2.5v3M14 2.5v3" /></svg></span
            ><span class="nav-label">Events</span></a
          >
          <a class="nav-item" href="Calendar.html" title="Calendar"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <rect x="2.5" y="4" width="15" height="13" rx="1.5" />
                <path
                  d="M2.5 8h15M6 2.5v3M14 2.5v3M6.5 11h.1M10 11h.1M13.5 11h.1"
                /></svg></span
            ><span class="nav-label">Calendar</span></a
          >
          <a
            class="nav-item is-active"
            href="Student-Participation.html"
            title="My Participation"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="7" cy="6" r="2.5" />
                <path
                  d="M2.8 16a4.2 4.2 0 0 1 8.4 0M12.5 9a2.3 2.3 0 1 0 0-4.5M13 11.5a4 4 0 0 1 4.2 4.5"
                /></svg></span
            ><span class="nav-label">My Participation</span></a
          >
          <a class="nav-item" href="Notification.html" title="Notifications"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <path d="M4 14h12l-1.2-1.7V8a4.8 4.8 0 0 0-9.6 0v4.3L4 14Z" />
                <path d="M8 16a2 2 0 0 0 4 0" /></svg></span
            ><span class="nav-label">Notifications</span
            ><span class="nav-badge" id="navNotifBadge"></span
          ></a>
          <a
            class="nav-item"
            href="StudentProfile.html"
            title="Profile"
            aria-current="page"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" aria-hidden="true">
                <circle cx="10" cy="6.5" r="3" />
                <path d="M4 17a6 6 0 0 1 12 0" /></svg></span
            ><span class="nav-label">Profile</span></a
          >
        </nav>
        <div class="sidebar-bottom">
          <div class="user-card">
            <div class="avatar">JL</div>
            <div class="user-meta">
              <div class="user-name">Joshua Lopez</div>
              <div class="user-role">IBITS | BSIT 2-3 Ladderized</div>
            </div>
          </div>
          <a class="nav-item logout" href="StudentLogin.html"
            ><span class="nav-icon"
              ><svg viewBox="0 0 20 20" fill="none">
                <path
                  d="M8 17H4.8A1.8 1.8 0 0 1 3 15.2V4.8A1.8 1.8 0 0 1 4.8 3H8M13 13.5 17 10l-4-3.5M7.5 10H17"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                /></svg></span
            ><span class="nav-label">Logout</span></a
          >
        </div>
      </aside>

      <main class="main" id="participationMain">
        <section
          class="participation-toolbar"
          id="participationFilterSection"
          aria-label="Participation controls"
        >
          <div class="search-box">
            <svg
              width="16"
              height="16"
              viewBox="0 0 20 20"
              fill="none"
              aria-hidden="true"
            >
              <circle
                cx="8.8"
                cy="8.8"
                r="5.6"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M13 13l4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              /></svg
            ><input
              id="participationSearch"
              type="search"
              placeholder="PUP Connect!"
              aria-label="Search participation"
            />
          </div>
          <label class="filter-select-wrap" for="participationFilter"
            >Filter participation
            <select id="participationFilter" class="filter-select">
              <option value="all">All Events</option>
              <option value="Participating">Participating</option>
              <option value="Declined">Declined</option>
              <option value="Cancelled">Cancelled</option>
              <option value="Completed">Completed</option>
            </select>
          </label>
        </section>

        <section
          class="participation-panel"
          id="participationSection"
          aria-labelledby="participationHeading"
        >
          <div class="panel-head">
            <h2 id="participationHeading">My Participation</h2>
            <span id="participationCount" class="hint-label"></span>
          </div>
          <div
            id="participationList"
            class="participation-list"
            aria-live="polite"
          ></div>
        </section>
      </main>
    </div>

    <div class="modal-overlay event-detail-overlay" id="modalOverlay">
      <div
        class="modal event-detail-reference"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="Close"
        >
          &times;
        </button>
        <div class="modal-tag" id="modalTag" data-modal-field="category"></div>
        <h3 id="modalTitle" data-modal-field="title"></h3>
        <div
          class="modal-row"
          id="modalLocation"
          data-modal-field="location"
        ></div>
        <div class="modal-row" id="modalTime" data-modal-field="time"></div>
        <div class="modal-row" id="modalRoom" data-modal-field="room"></div>
        <p class="modal-desc" id="modalDesc" data-modal-field="description"></p>
        <div class="modal-foot">
          <span
            class="modal-slots"
            id="modalSlots"
            data-modal-field="participants"
          ></span
          ><button type="button" class="modal-back" id="modalBack" hidden>
            Back</button
          ><button
            class="btn-primary"
            id="modalRegister"
            data-modal-field="action"
          >
            View Details
          </button>
        </div>
      </div>
    </div>
    <div class="modal-overlay" id="dayModalOverlay">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dayModalTitle"
      >
        <button
          type="button"
          class="modal-close"
          id="dayModalClose"
          aria-label="Close"
        >
          &times;
        </button>
        <h3 id="dayModalTitle"></h3>
        <div class="day-modal-list" id="dayModalList"></div>
      </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="events-data.js"></script>
    <script src="notification-count.js"></script>
    <script src="student-sidebar-profile.js"></script>
    <script src="../EventDetailsModal.js"></script>
    <script src="Student-Participation.js"></script>
  </body>
</html>
