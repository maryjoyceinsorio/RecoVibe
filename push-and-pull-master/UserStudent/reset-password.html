<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student portal - Reset password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ForgetPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Student Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card" aria-labelledby="reset-heading">
          <h2 id="reset-heading">Reset your password</h2>
          <p class="sub">
            Create a new password for your RecoVibe Student Portal account.
          </p>

          <div class="field password-field" id="new-password-field">
            <label for="new-password">New password</label>
            <input
              type="password"
              id="new-password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="pass-toggle"
              data-password-target="new-password"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>

          <div class="field password-field" id="confirm-password-field">
            <label for="confirm-password">Confirm new password</label>
            <input
              type="password"
              id="confirm-password"
              autocomplete="new-password"
            />
            <button
              type="button"
              class="pass-toggle"
              data-password-target="confirm-password"
              aria-label="Show password"
              aria-pressed="false"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <p class="match-message" id="match-message" aria-live="polite"></p>

          <div class="requirements-title">Password must contain:</div>
          <ul class="requirements" id="requirements">
            <li data-requirement="length">At least 8 characters</li>
            <li data-requirement="uppercase">At least one uppercase letter</li>
            <li data-requirement="number">At least one number</li>
          </ul>
          <button type="button" class="btn-primary" id="reset-password">
            Reset Password
          </button>
        </section>
      </main>
    </div>
    <script src="forgot-flow.js"></script>
  </body>
</html>
