<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student portal - Verify email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ForgetPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Student Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card" aria-labelledby="verify-heading">
          <a href="ForgetPassword.html" class="back-link"
            >&larr; Back to forgot password</a
          >
          <h2 id="verify-heading">Reset your password</h2>
          <p class="sub">
            RecoVibe now sends a secure password reset link directly to your
            school email. Request a new link to continue.
          </p>
          <a
            class="btn-primary"
            href="ForgetPassword.html"
            style="display: block; text-align: center; text-decoration: none"
            >Request reset link</a
          >
        </section>
      </main>
    </div>
  </body>
</html>
