<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecoVibe — PUP Biñan Campus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --maroon-900: #4f1420;
        --maroon-800: #661a29;
        --maroon-700: #7a1f2e;
        --maroon-600: #8f2536;
        --gold-500: #c79a2b;
        --gold-400: #d6ae4a;
        --cream-50: #faf7f1;
        --cream-100: #f4efe4;
        --paper: #ffffff;
        --line: #e6e0d3;
        --ink-900: #241a17;
        --ink-700: #4a3d38;
        --ink-500: #7a6d66;
        --ink-300: #a89d95;
        --red-500: #c4444a;
        --blue-500: #3a76c4;
        --green-600: #3d8f5e;
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --shadow-card:
          0 1px 2px rgba(36, 26, 23, 0.05), 0 1px 0 rgba(36, 26, 23, 0.03);
        --font-display: "Fraunces", serif;
        --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      }

      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink-900);
        background: var(--cream-50);
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ============ SIDEBAR ============ */
      .sidebar {
        width: 264px;
        flex-shrink: 0;
        height: 100vh;
        position: sticky;
        top: 0;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--maroon-700) 0%,
          var(--maroon-800) 100%
        );
        color: #f3e9dc;
        display: flex;
        flex-direction: column;
        padding: 20px 16px;
        transition: none;
        align-self: flex-start;
      }
      .sidebar.is-ready {
        transition: width 0.22s ease;
      }
      .sidebar.is-collapsed {
        width: 76px;
        padding: 20px 12px;
      }

      .sidebar-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 28px;
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 9px;
        background: linear-gradient(160deg, var(--gold-400), var(--gold-500));
        color: var(--maroon-900);
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-text {
        min-width: 0;
        overflow: hidden;
      }
      .brand-name {
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 19px;
        line-height: 1.1;
        letter-spacing: 0.2px;
        white-space: nowrap;
      }
      .brand-sub {
        font-size: 11.5px;
        color: #d9b9bf;
        white-space: nowrap;
        margin-top: 2px;
      }
      .sidebar.is-collapsed .brand-text,
      .sidebar.is-collapsed .nav-label,
      .sidebar.is-collapsed .user-meta,
      .sidebar.is-collapsed .nav-badge {
        display: none;
      }
      .sidebar.is-collapsed .brand {
        justify-content: center;
        width: 100%;
      }
      .sidebar.is-collapsed .sidebar-top {
        flex-direction: column;
        justify-content: center;
        gap: 14px;
      }

      .collapse-btn {
        width: 28px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.05);
        color: #f3e9dc;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
        cursor: pointer;
      }
      .collapse-btn:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .collapse-btn:focus-visible {
        outline: 2px solid var(--gold-400);
        outline-offset: 2px;
      }
      .collapse-btn svg {
        width: 14px;
        height: 14px;
        display: block;
        transition: transform 0.2s ease;
      }
      .sidebar.is-collapsed .collapse-btn svg {
        transform: rotate(180deg);
      }

      .nav {
        display: flex;
        flex-direction: column;
        gap: 3px;
        flex: 1;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 9px;
        color: #e9d6db;
        font-size: 14.5px;
        font-weight: 500;
        position: relative;
        transition:
          background 0.15s ease,
          color 0.15s ease;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }
      .nav-item.is-active {
        background: rgba(255, 255, 255, 0.14);
        border-left: 3px solid var(--gold-400);
        color: #fff;
        font-weight: 600;
        padding-left: 9px;
      }
      .nav-item.is-active .nav-icon {
        color: var(--gold-400);
      }
      .nav-item.is-active .nav-icon svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        fill: none;
      }
      .nav-icon {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: currentColor;
      }
      .nav-icon svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .nav-label {
        white-space: nowrap;
        overflow: hidden;
      }
      .nav-badge {
        margin-left: auto;
        background: var(--red-500);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        min-width: 19px;
        height: 19px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
      }
      .nav-badge[hidden] {
        display: none;
      }
      .sidebar.is-collapsed .nav-item {
        justify-content: center;
      }

      .sidebar-bottom {
        margin-top: auto;
        padding-top: 14px;
        border-top: 1px solid rgba(255, 255, 255, 0.14);
      }
      .user-card {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        margin-bottom: 6px;
        min-width: 0;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: linear-gradient(160deg, var(--gold-400), var(--gold-500));
        color: var(--maroon-900);
        font-weight: 700;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .user-meta {
        min-width: 0;
        overflow: hidden;
      }
      .user-name {
        font-size: 14px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .user-role {
        font-size: 11px;
        color: #d9b9bf;
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sidebar.is-collapsed .user-card {
        justify-content: center;
      }
      .nav-item.logout {
        color: #e9d6db;
      }

      /* ============ MAIN ============ */
      .main {
        flex: 1;
        min-width: 0;
        padding: 32px 40px 56px;
      }

      .topbar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 24px;
      }
      .greeting {
        font-family: var(--font-display);
        font-size: 32px;
        font-weight: 600;
        margin: 0 0 8px;
        color: var(--ink-900);
      }
      .subgreeting {
        margin: 0;
        max-width: 560px;
        color: var(--ink-500);
        font-size: 14.5px;
        line-height: 1.55;
      }
      .today {
        text-align: right;
        flex-shrink: 0;
      }
      .today-label {
        font-size: 13px;
        color: var(--ink-500);
        font-weight: 600;
      }
      .today-date {
        font-size: 15px;
        color: var(--ink-900);
        font-weight: 600;
        margin-top: 2px;
      }

      .search-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 26px;
        flex-wrap: nowrap;
        position: relative;
        z-index: 30;
      }
      .search-box {
        flex: 1 1 auto;
        min-width: 220px;
        max-width: none;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 9px 16px;
      }
      .search-icon {
        color: var(--ink-300);
        flex-shrink: 0;
      }
      .search-box input {
        border: none;
        outline: none;
        font-size: 14px;
        width: 100%;
        background: transparent;
        color: var(--ink-900);
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: var(--ink-300);
      }

      .filter-pills {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: nowrap;
        flex: 0 0 auto;
      }
      .filter-dropdown {
        position: relative;
        z-index: 20;
      }
      .filter-dropdown:focus-within {
        z-index: 1001;
      }
      .filter-button {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: 40px;
        border: 1px solid var(--ink-900);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink-900);
        padding: 9px 12px;
        font: 500 12px var(--font-body);
        white-space: nowrap;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }
      .filter-button::after {
        content: "";
        width: 6px;
        height: 6px;
        border-right: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
      }
      .filter-button:hover,
      .filter-button:focus-visible {
        background: var(--cream-100);
        outline: 2px solid rgba(122, 31, 46, 0.15);
        outline-offset: 1px;
      }
      .filter-menu {
        position: absolute;
        top: calc(100% + 5px);
        left: 0;
        min-width: 100%;
        width: max-content;
        max-width: min(250px, calc(100vw - 32px));
        padding: 4px 0;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--paper);
        box-shadow: 0 10px 24px rgba(36, 26, 23, 0.14);
        visibility: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translateY(-6px) scale(0.98);
        transform-origin: top center;
        transition:
          opacity 0.18s ease,
          transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
        z-index: 1000;
      }
      .filter-menu.show {
        visibility: visible;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }
      .filter-option {
        display: block;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: var(--paper);
        color: var(--ink-900);
        padding: 9px 12px;
        text-align: left;
        font: 500 12px var(--font-body);
        white-space: nowrap;
      }
      .filter-option:last-child {
        border-bottom: 0;
      }
      .filter-option:hover,
      .filter-option:focus-visible {
        background: var(--cream-100);
        outline: 0;
      }
      .filter-option.active {
        background: #eeeeee;
      }
      .filter-dropdown--events .filter-button {
        min-width: 118px;
      }
      .filter-dropdown--sources .filter-button {
        min-width: 124px;
      }
      .filter-dropdown--category .filter-button {
        min-width: 104px;
      }
      .filter-dropdown--date .filter-button {
        min-width: 82px;
      }
      .filter-dropdown--status .filter-button {
        min-width: 112px;
      }
      .filter-dropdown--availability .filter-button {
        min-width: 103px;
      }
      .nav-icon svg {
        width: 100%;
        height: 100%;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      @media (max-width: 700px) {
        .search-row {
          flex-wrap: wrap;
        }
        .filter-pills {
          flex-wrap: wrap;
        }
        .filter-dropdown {
          flex: 1 1 140px;
        }
        .filter-button {
          width: 100%;
        }
        .filter-menu {
          max-width: calc(100vw - 32px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .filter-menu {
          transition-duration: 0s;
        }
      }

      .event-detail-overlay {
        z-index: 100;
        padding: 7px;
        background: rgba(36, 26, 23, 0.58);
      }
      .detail-modal.event-detail-reference {
        position: relative;
        width: min(1160px, calc(100vw - 14px));
        max-width: none;
        max-height: calc(100vh - 14px);
        max-height: calc(100dvh - 14px);
        overflow: hidden;
        padding: 14px 24px 20px;
        border: 2px solid var(--maroon-700);
        border-radius: 9px;
        background: #fffdfb;
        box-shadow: 0 20px 60px rgba(36, 26, 23, 0.25);
      }
      .detail-modal.event-detail-reference #modalContent {
        max-height: calc(100dvh - 52px);
        padding-right: 10px;
      }
      .detail-modal.event-detail-reference .modal-close {
        top: 1px;
        right: 8px;
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        border: 1px solid var(--gold-400);
        border-radius: 0;
        background: #fffdfb;
        color: var(--maroon-700);
        font-size: 31px;
      }
      .detail-modal.event-detail-reference .detail-header-copy h3 {
        font: 700 31px/1.12 var(--font-display);
        color: var(--ink-900);
      }
      .detail-modal.event-detail-reference .detail-source {
        margin-top: 0;
        color: var(--maroon-700);
        font: 700 13px/1.35 var(--font-body);
      }
      .detail-modal.event-detail-reference .detail-meta {
        gap: 8px 20px;
        margin: 12px 0 8px;
        color: var(--ink-900);
        font: 400 14px/1.35 var(--font-body);
      }
      .detail-modal.event-detail-reference .modal-tag-wrap {
        margin: 6px 0 18px;
      }
      .detail-modal.event-detail-reference .detail-grid {
        gap: 20px 34px;
      }
      .detail-modal.event-detail-reference .detail-section h4,
      .detail-modal.event-detail-reference .detail-copy-block h4 {
        font: 700 18px/1.2 var(--font-display);
        color: var(--ink-900);
      }
      .detail-modal.event-detail-reference .detail-section p,
      .detail-modal.event-detail-reference .detail-section li,
      .detail-modal.event-detail-reference .detail-copy-block p,
      .detail-modal.event-detail-reference .detail-copy-block li {
        font: 400 14px/1.5 var(--font-body);
        color: var(--ink-900);
      }
      .detail-modal.event-detail-reference .requirements-box {
        border-color: #a98be2;
        background: transparent;
      }
      @media (max-width: 700px) {
        .detail-modal.event-detail-reference {
          width: calc(100vw - 14px);
          padding: 16px 16px 20px;
        }
        .detail-modal.event-detail-reference .detail-header-copy h3 {
          font-size: 25px;
        }
        .detail-modal.event-detail-reference .detail-grid {
          grid-template-columns: 1fr;
        }
      }

      .panel-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .panel-head--spaced {
        margin-top: 30px;
      }
      .panel-head h2 {
        font-family: var(--font-display);
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .events-panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 20px 22px 22px;
        box-shadow: var(--shadow-card);
        margin-bottom: 24px;
      }
      .events-panel:last-child {
        margin-bottom: 0;
      }
      .events-panel .event-list {
        margin-bottom: 0;
      }
      .events-panel .event-list > p {
        margin: 0;
        color: var(--ink-500);
        font-size: 14px;
      }

      /* Event list */
      .event-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
      }
      .event-card {
        display: flex;
        gap: 16px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 16px;
        box-shadow: var(--shadow-card);
      }
      .event-date {
        flex-shrink: 0;
        width: 56px;
        height: 56px;
        border-radius: var(--radius-sm);
        background: var(--cream-100);
        color: var(--maroon-700);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-weight: 700;
      }
      .event-date .mon {
        font-size: 11px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .event-date .day {
        font-family: var(--font-display);
        font-size: 19px;
        line-height: 1.1;
      }
      .event-date .year {
        font-size: 10px;
        color: var(--ink-500);
        margin-top: 1px;
      }
      .event-body {
        flex: 1;
        min-width: 0;
      }
      .event-title {
        font-size: 15.5px;
        font-weight: 600;
        margin: 0 0 2px;
      }
      .event-source {
        font-size: 13px;
        color: var(--ink-500);
        margin: 0 0 8px;
      }
      .event-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--ink-500);
        margin-bottom: 8px;
      }
      .event-meta span {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .event-meta svg {
        flex-shrink: 0;
        color: var(--ink-300);
      }
      .event-category-row {
        margin-bottom: 2px;
      }
      .tag {
        display: inline-block;
        font-size: 11.5px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
        background: #f2dfe1;
        color: var(--maroon-700);
      }
      .category {
        display: inline-block;
        align-self: flex-start;
        font-size: 11.5px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 999px;
      }
      .category-academic {
        background: #dfe8f5;
        color: var(--blue-500);
      }
      .category-tech {
        background: #e4def5;
        color: #6546a5;
      }
      .category-leadership {
        background: #f2dfe1;
        color: var(--maroon-700);
      }
      .category-sports {
        background: #dcefe2;
        color: var(--green-600);
      }
      .category-music {
        background: #f7e1d4;
        color: #a3542b;
      }
      .category-orgs {
        background: #e8e1f4;
        color: #67499b;
      }
      .category-social {
        background: #f9e7d1;
        color: #a85b20;
      }
      .category-community {
        background: #dcefe8;
        color: #247b58;
      }
      .category-competitions {
        background: #f5e0ea;
        color: #a13c6d;
      }
      .category-seminars {
        background: #e5e4f7;
        color: #5057a1;
      }
      .category-arts {
        background: #f7e1d4;
        color: #a3542b;
      }
      .category-university {
        background: #dfe8f5;
        color: #315e9b;
      }
      .event-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      .slots {
        font-size: 12.5px;
        color: var(--ink-500);
        font-weight: 500;
      }
      .btn-outline {
        border: 1px solid var(--ink-300);
        background: transparent;
        color: var(--ink-900);
        font-size: 12.5px;
        font-weight: 600;
        padding: 7px 16px;
        border-radius: 999px;
        transition:
          background 0.15s ease,
          border-color 0.15s ease;
      }
      .btn-outline:hover {
        border-color: var(--maroon-700);
        background: var(--cream-100);
      }

      /* Status Text Helpers */
      .status-closed {
        color: var(--blue-500);
        font-weight: 600;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(36, 26, 23, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 50;
      }
      .modal-overlay.is-open {
        display: flex;
      }
      .modal {
        background: var(--paper);
        border-radius: var(--radius-lg);
        padding: 28px;
        max-width: 420px;
        width: 100%;

                  data-value="Rejected"
                >
                  Rejected
                </button>
              </div>
            </div>
            <div class="filter-dropdown filter-dropdown--availability">
              <button
                type="button"
                class="filter-button"
                data-filter="availability"
                aria-expanded="false"
              >
                Availability
              </button>
              <div class="filter-menu" data-menu="availability">
                <button
                  type="button"
                  class="filter-option active"
                  data-value="all"
                >
                  Any Availability</button
                ><button
                  type="button"
                  class="filter-option"
                  data-value="available"
                >
                  Available</button
                ><button type="button" class="filter-option" data-value="full">
                  Full
                </button>
              </div>
            </div>
          </div>
        </section>

        <section class="events-panel" aria-labelledby="happeningNowHeading">
          <div class="panel-head">
            <h2 id="happeningNowHeading">Events Happening Now</h2>
          </div>
          <div
            class="event-list"
            id="happeningNowList"
            data-event-group="happening-now"
          ></div>
        </section>

        <section class="events-panel" aria-labelledby="allEventsHeading">
          <div class="panel-head">
            <h2 id="allEventsHeading">All Events</h2>
          </div>
          <div
            class="event-list"
            id="upcomingEventsList"
            data-event-group="all-events"
          ></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <div class="modal-overlay event-detail-overlay" id="modalOverlay">
      <div
        class="modal detail-modal event-detail-reference"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <button
          type="button"
          class="modal-close"
          id="modalClose"
          aria-label="Close"
        >
          &times;
        </button>
        <div id="modalContent"></div>
      </div>
    </div>

    <div class="modal-overlay" id="confirmOverlay">
      <div
        class="modal confirm-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="confirmTitle"
      >
        <button
          type="button"
          class="modal-close"
          id="confirmClose"
          aria-label="Close"
        >
          &times;
        </button>
        <h2 class="confirm-title" id="confirmTitle">Join Event?</h2>
        <p class="confirm-text">
          Are you sure you want to join the
          <strong id="confirmEventName">event</strong>?<br />By confirming, you
          will be registered as a participant for this event.
        </p>
        <div class="confirm-actions">
          <button type="button" class="confirm-primary" id="confirmParticipate">
            Participate
          </button>
          <button type="button" class="confirm-cancel" id="confirmCancel">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <script src="events-data.js"></script>
    <script src="notification-count.js"></script>
    <script src="../EventDetailsModal.js"></script>
    <script>
      function hydrateUserProfile() {
        const user =
          JSON.parse(localStorage.getItem("recovibeCurrentUser") || "null") ||
          {};
        const storedFirstName = String(user.firstName || "").trim();
        const storedFullName = String(user.name || user.fullName || "").trim();
        const nameFromProfile = [
          storedFirstName,
          user.middleName,
          user.lastName,
        ]
          .map((part) => String(part || "").trim())
          .filter(Boolean)
          .join(" ");
        const displayName = storedFullName || nameFromProfile || "Student";
        const firstName =
          storedFirstName ||
          storedFullName.split(/\s+/).filter(Boolean)[0] ||
          nameFromProfile.split(/\s+/).filter(Boolean)[0] ||
          "";
        const avatarFallback = [
          user.username,
          user.studentNumber,
          user.studentId,
          user.email,
        ]
          .map((value) => String(value || "").trim())
          .find(Boolean) || "";
        const avatarLetter =
          Array.from(firstName || avatarFallback)[0]?.toLocaleUpperCase() ||
          "S";
        const organization = String(user.organization || "").trim();
        const role =
          organization && organization.toLowerCase() !== "none"
            ? organization
            : "Student";

        document.querySelectorAll(".user-name").forEach((element) => {
          element.textContent = displayName;
        });
        document.querySelectorAll(".user-role").forEach((element) => {
          element.textContent = role;
        });
        document.querySelectorAll(".avatar").forEach((element) => {
          element.textContent = avatarLetter;
        });
        document.querySelectorAll("#userFirstName").forEach((element) => {
          element.textContent = firstName;
        });
      }

      (function wireSidebar() {
        const EVENTS = Array.isArray(window.RECOVIBE_EVENTS)
          ? window.RECOVIBE_EVENTS
          : [];
        hydrateUserProfile();
        const sidebar = document.getElementById("sidebar");
        const collapseBtn = document.getElementById("collapseBtn");
        const today = new Date();

        function escapeHTML(value) {
          return String(value).replace(
            /[&<>"']/g,
            (character) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[character],
          );
        }

        function renderCurrentDate() {
          const todayDateEl = document.getElementById("todayDate");
          if (!todayDateEl) return;
          todayDateEl.textContent = today.toLocaleDateString("en-US", {
            year: "numeric",
            month: "long",
            day: "numeric",
          });
        }

        const filterState = {
          view: "all",
          source: "All Sources",
          category: "All Categories",
          date: "all",
          status: "all",
          availability: "all",
        };
        const participationStorageKey = "recovibeParticipations";

        const categoryAliases = {
          "Academic & Learning": ["academic"],
          "Tech & Innovation": ["tech", "innovation"],
          "Leadership & Career": [
            "leadership",
            "career",
            "student development",
          ],
          "Sports & Fitness": ["sports", "fitness"],
          "Music & Entertainment": ["music", "entertainment"],
          "Orgs & Student Acts": ["org", "organization", "student act"],
          "Social Events": ["social"],
          "Community & Outreach": ["community", "outreach"],
          Competitions: ["competition", "hackathon"],
          "Seminars & Workshops": ["seminar", "workshop"],
          "Arts & Culture": ["arts", "culture"],
          "University & Campuses": ["university", "campus"],
        };

        const sourceAliases = {
          "PUP Official": ["PUP Official"],
          "PUP Biñan": ["PUP Biñan", "PUP Biñan Campus"],
          Organizational: [
            "Organization",
            "Organizational",
            "IBITS",
            "Event Organizer",
          ],
          CSC: ["CSC"],
          "Teacher / Faculty": ["Teacher / Faculty", "Teachers/Faculty"],
          "Others / External": [
            "Other / External",
            "Others/External",
            "Others / External",
            "Admin",
          ],
        };

        function getParticipationIds() {
          try {
            const saved = JSON.parse(
              localStorage.getItem(participationStorageKey) || "[]",
            );
            return new Set(Array.isArray(saved) ? saved : []);
          } catch (error) {
            return new Set();
          }
        }

        function getEventSlots(event) {
          if (event.capacityMode === "N/A") return Infinity;
          try {
            const savedSlots = JSON.parse(
              localStorage.getItem("recovibeEventSlots") || "{}",
            );
            const value = savedSlots[String(event.id)];
            return Math.max(
              0,
              Number(
                value !== undefined
                  ? value
                  : (event.slotsOpen ?? event.slots ?? 0),
              ) || 0,
            );
          } catch (error) {
            return Math.max(
              0,
              Number(event.slotsOpen ?? event.slots ?? 0) || 0,
            );
          }
        }

        function getPreferredCategory(category) {
          const normalized = String(category || "").toLowerCase();
          return (
            Object.keys(categoryAliases).find((label) =>
              categoryAliases[label].some((value) =>
                normalized.includes(value),
              ),
            ) || category
          );
        }

        function getCategoryClass(category) {
          const categoryClassNames = {
            "Academic & Learning": "academic",
            "Tech & Innovation": "tech",
            "Leadership & Career": "leadership",
            "Sports & Fitness": "sports",
            "Music & Entertainment": "music",
            "Orgs & Student Acts": "orgs",
            "Social Events": "social",
            "Community & Outreach": "community",
            Competitions: "competitions",
            "Seminars & Workshops": "seminars",
            "Arts & Culture": "arts",
            "University & Campuses": "university",
          };
          return (
            categoryClassNames[getPreferredCategory(category)] || "academic"
          );
        }

        function eventMatches(event) {
          const query = document
            .getElementById("searchInput")
            .value.trim()
            .toLowerCase();
          const sourceValues = sourceAliases[filterState.source] || [
            filterState.source,
          ];
          const categoryValues = categoryAliases[filterState.category] || [];
          const eventDate = new Date(`${event.dateISO}T00:00:00`);
          const todayDate = new Date();
          todayDate.setHours(0, 0, 0, 0);
          const weekStart = new Date(todayDate);
          weekStart.setDate(todayDate.getDate() - todayDate.getDay());
          const weekEnd = new Date(weekStart);
          weekEnd.setDate(weekStart.getDate() + 7);
          const matchesView =
            filterState.view === "all" || getParticipationIds().has(event.id);
          const matchesSource =
            filterState.source === "All Sources" ||
            sourceValues.includes(event.source);
          const eventCategory = String(event.category || "").toLowerCase();
          const matchesCategory =
            filterState.category === "All Categories" ||
            categoryValues.some((value) => eventCategory.includes(value));
          const matchesDate =
            filterState.date === "all" ||
            (filterState.date === "today" &&
              eventDate.getTime() === todayDate.getTime()) ||
            (filterState.date === "week" &&
              eventDate >= weekStart &&
              eventDate < weekEnd) ||
            (filterState.date === "month" &&
              eventDate.getFullYear() === todayDate.getFullYear() &&
              eventDate.getMonth() === todayDate.getMonth()) ||
            (filterState.date === "upcoming" && eventDate >= todayDate);
          const eventStatus =
            event.status ||
            (Number(event.slotsOpen) > 0
              ? "Available to Join"
              : "Registration Closed");
          const matchesStatus =
            filterState.status === "all" || eventStatus === filterState.status;
          const openSlots = getEventSlots(event);
          const matchesAvailability =
            filterState.availability === "all" ||
            (filterState.availability === "available" && openSlots > 20) ||
            (filterState.availability === "full" && openSlots <= 0);
          const matchesQuery =
            !query ||
            [
              event.title,
              event.location,
              event.source,
              event.tag,
              event.category,
            ].some((value) =>
              String(value || "")
                .toLowerCase()
                .includes(query),
            );
          return (
            matchesView &&
            matchesSource &&
            matchesCategory &&
            matchesDate &&
            matchesStatus &&
            matchesAvailability &&
            matchesQuery
          );
        }

        function renderEvent(event) {
          const displayDate = new Date(`${event.dateISO}T00:00:00`);
          const displayMonth = displayDate
            .toLocaleDateString("en-US", { month: "short" })
            .toUpperCase();
          const preferredCategory = getPreferredCategory(
            event.category || "General",
          );
          return `<article class="event-card" id="event-card-${event.id}" data-event-id="${event.id}">
        <div class="event-date" id="event-date-${event.id}" data-event-field="date"><span class="mon" id="event-month-${event.id}">${displayMonth}</span><span class="day" id="event-day-${event.id}">${displayDate.getDate()}</span><span class="year" id="event-year-${event.id}">${displayDate.getFullYear()}</span></div>
        <div class="event-body">
          <h3 class="event-title" id="event-title-${event.id}" data-event-field="title">${escapeHTML(event.title)}</h3>
          <p class="event-source" id="event-source-${event.id}" data-event-field="source">${escapeHTML(event.source || "Event Organizer")}</p>
          <div class="event-meta" id="event-meta-${event.id}" data-event-field="schedule"><span id="event-time-${event.id}" data-event-field="time">🕐 ${escapeHTML(event.time || "Schedule to be announced")}</span><span id="event-location-${event.id}" data-event-field="location">🏛 ${escapeHTML(event.location || "Location TBD")} · ${escapeHTML(event.room || "Room TBD")}</span></div>
          <div class="event-category-row" id="event-category-row-${event.id}"><span class="category category-${getCategoryClass(event.category)}" id="event-category-${event.id}" data-event-field="category">${escapeHTML(preferredCategory)}</span></div>
          <div class="event-foot" id="event-footer-${event.id}"><span class="slots" id="event-slots-${event.id}" data-event-field="participants">${event.capacityMode === "N/A" ? "No capacity limit" : `${getEventSlots(event)} of ${event.maxSlots ?? event.capacity ?? 0} Slots Open`}</span><button type="button" class="btn-outline" id="event-details-button-${event.id}" data-event-id="${event.id}" aria-controls="studentEventDetailsDialog">View Details</button></div>
        </div>
      </article>`;
        }

        function getStatusHeadingLabel() {
          return "All Events";
        }

        function getHappeningNowEvents() {
          const todayDate = new Date();
          todayDate.setHours(0, 0, 0, 0);
          return EVENTS.filter((event) => {
            const eventDate = new Date(`${event.dateISO}T00:00:00`);
            return (
              !Number.isNaN(eventDate.getTime()) &&
              eventDate.getTime() === todayDate.getTime()
            );
          });
        }

        function renderEvents() {
          const filterMatches = EVENTS.filter(eventMatches);
          const currentEvents = getHappeningNowEvents().filter(eventMatches);
          const currentIds = new Set(currentEvents.map((event) => event.id));
          const upcomingEvents = filterMatches.filter(
            (event) => !currentIds.has(event.id),
          );
          const current = document.getElementById("happeningNowList");
          const upcoming = document.getElementById("upcomingEventsList");
          current.innerHTML = currentEvents.length
            ? currentEvents.map(renderEvent).join("")
            : "<p>No events happening now.</p>";
          upcoming.innerHTML = upcomingEvents.length
            ? upcomingEvents.map(renderEvent).join("")
            : "<p>No events match your filters.</p>";
        }

        function closeFilterMenus() {
          document
            .querySelectorAll(".filter-menu.show")
            .forEach((menu) => menu.classList.remove("show"));
          document
            .querySelectorAll(".filter-button[aria-expanded='true']")
            .forEach((button) => button.setAttribute("aria-expanded", "false"));
        }

        function setupFilterDropdowns() {
          document.querySelectorAll(".filter-dropdown").forEach((dropdown) => {
            const button = dropdown.querySelector(".filter-button");
            const menu = dropdown.querySelector(".filter-menu");
            const filterName = button.dataset.filter;
            button.addEventListener("click", (event) => {
              event.stopPropagation();
              const isOpen = menu.classList.contains("show");
              closeFilterMenus();
              if (!isOpen) {
                menu.classList.add("show");
                button.setAttribute("aria-expanded", "true");
              }
            });
            menu.addEventListener("click", (event) => {
              const option = event.target.closest(".filter-option");
              if (!option) return;
              event.stopPropagation();
              filterState[filterName] = option.dataset.value;
              menu
                .querySelectorAll(".filter-option")
                .forEach((item) =>
                  item.classList.toggle("active", item === option),
                );
              button.childNodes[0].textContent = option.textContent;
              closeFilterMenus();
              renderEvents();
            });
          });
          document.addEventListener("click", (event) => {
            if (!event.target.closest(".filter-dropdown")) closeFilterMenus();
          });
          document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") closeFilterMenus();
          });
        }

        let selectedEventId = null;

        function renderEventDetailMarkup(event) {
          const required =
            (event.requirements && event.requirements.required) || [];
          const recommended =
            (event.requirements && event.requirements.recommended) || [];
          const reminders = event.reminders || [];
          const details = event.detailedInfo || [];
          const locationLabel = event.location || "Campus";
          const capacity = event.capacity || event.maxSlots || event.slots || 0;
          const registrationStatus =
            event.registrationInfo || event.status || "Available to Join";
          const deadline = event.registrationDeadline || "TBA";

          const requiredList = required
            .map((item) => `<li>${escapeHTML(item)}</li>`)
            .join("");
          const recommendedList = recommended
            .map((item) => `<li>${escapeHTML(item)}</li>`)
            .join("");
          const reminderList = reminders
            .map((item) => `<li>${escapeHTML(item)}</li>`)
            .join("");
          const detailList = details
            .map((item) => `<li>${escapeHTML(item)}</li>`)
            .join("");

          return `
        <article class="event-details" id="event-details-${event.id}" data-event-id="${event.id}">
        <div class="detail-topline" id="event-details-header-${event.id}">
          <div class="detail-header-copy">
            <div class="detail-source" id="event-detail-source-${event.id}" data-event-field="source">Event Source: ${escapeHTML(event.source || locationLabel)}</div>
            <h3 id="event-detail-title-${event.id}" data-event-field="title">${escapeHTML(event.title)}</h3>
          </div>
        </div>
        <div class="detail-meta" id="event-detail-meta-${event.id}">
          <span class="detail-meta-item" id="event-detail-time-${event.id}" data-event-field="time"><span class="detail-meta-icon">🕐</span><span>${escapeHTML(event.time || "Schedule to be announced")}</span></span>
          <span class="detail-meta-item" id="event-detail-location-${event.id}" data-event-field="location"><span class="detail-meta-icon">🏛</span><span>${escapeHTML(event.location || locationLabel)} · ${escapeHTML(event.room || "Room TBD")}</span></span>
        </div>
        <div class="modal-tag-wrap" id="event-detail-category-wrap-${event.id}"><span class="modal-tag" id="event-detail-category-${event.id}" data-event-field="category">${escapeHTML(getPreferredCategory(event.category || "General"))}</span></div>
        <div class="detail-grid">
          <div class="detail-panel" id="event-detail-primary-${event.id}">
            <div class="detail-section" id="event-detail-about-${event.id}">
              <h4>About the Event:</h4>
              <p class="event-description" id="event-detail-description-${event.id}" data-event-field="description">${escapeHTML(event.desc)}</p>
            </div>
            <div class="detail-section" id="event-detail-requirements-${event.id}">
              <h4>Requirements:</h4>
              <div class="requirements-box">
                <h5>Required:</h5>
                <ul>${requiredList || "<li>None specified.</li>"}</ul>
                <h5>Recommended:</h5>
                <ul>${recommendedList || "<li>None specified.</li>"}</ul>
              </div>
            </div>
            <div class="detail-section" id="event-detail-reminders-${event.id}">
              <h4>Important Reminders:</h4>
              <ul class="reminder-list">${reminderList || "<li>None.</li>"}</ul>
            </div>
            <button type="button" class="participate-btn" id="event-detail-participate-${event.id}" data-event-action="participate">Participate</button>
          </div>
          <div class="detail-panel detail-panel--secondary" id="event-detail-secondary-${event.id}">
            <div class="detail-copy-block" id="event-detail-information-${event.id}">
              <h4>Detailed Event Information:</h4>
              <p id="event-detail-category-value-${event.id}">Event Category: <strong>${escapeHTML(getPreferredCategory(event.category || "General"))}</strong></p>
              <p id="event-detail-capacity-${event.id}" data-event-field="capacity">Event Capacity: <strong>${capacity} Participants</strong></p>
            </div>
            <div class="detail-copy-block" id="event-detail-registration-${event.id}">
              <h4>Registration Details:</h4>
              <p id="event-detail-deadline-${event.id}" data-event-field="registration-deadline">Registration Deadline: <strong>${escapeHTML(deadline)}</strong></p>
              <p id="event-detail-status-${event.id}" data-event-field="registration-status">Your Status: <strong>${escapeHTML(registrationStatus)}</strong></p>
            </div>
            <div class="detail-copy-block" id="event-detail-focus-${event.id}">
              <h4>Focus Areas:</h4>
              <ul class="bullets" id="event-detail-focus-list-${event.id}">${detailList || "<li>General event engagement.</li>"}</ul>
            </div>
          </div>
        </div>
        </article>
      `;
        }

        function openEventModal(id) {
          const event = EVENTS.find((item) => item.id === id);
          if (!event) return;
          selectedEventId = event.id;
          window.RecovibeStudentEventDetails?.open(event);
        }

        function closeModal() {
          document.getElementById("modalOverlay").classList.remove("is-open");
          selectedEventId = null;
        }

        function openConfirmModal() {
          const event = EVENTS.find((item) => item.id === selectedEventId);
          if (!event) return;
          document.getElementById("confirmEventName").textContent = event.title;
          document.getElementById("confirmOverlay").classList.add("is-open");
        }

        function closeConfirmModal() {
          document.getElementById("confirmOverlay").classList.remove("is-open");
        }

        renderCurrentDate();
        renderEvents();

        function setSidebarCollapsed(collapsed) {
          sidebar.classList.toggle("is-collapsed", collapsed);
          localStorage.setItem("sidebarCollapsed", String(collapsed));
          if (collapseBtn) {
            collapseBtn.setAttribute("aria-expanded", String(!collapsed));
            collapseBtn.setAttribute(
              "aria-label",
              collapsed ? "Expand sidebar" : "Collapse sidebar",
            );
            collapseBtn.setAttribute(
              "title",
              collapsed ? "Expand sidebar" : "Collapse sidebar",
            );
          }
        }

        setSidebarCollapsed(
          window.matchMedia("(max-width: 860px)").matches
            ? false
            : localStorage.getItem("sidebarCollapsed") === "true",
        );
        requestAnimationFrame(() => sidebar.classList.add("is-ready"));

        if (collapseBtn) {
          collapseBtn.addEventListener("click", () => {
            if (!window.matchMedia("(max-width: 860px)").matches) {
              setSidebarCollapsed(!sidebar.classList.contains("is-collapsed"));
            }
          });
        }

        document.querySelectorAll(".nav-item[data-view]").forEach((item) => {
          item.addEventListener("click", (e) => {
            if (item.getAttribute("href") === "#") e.preventDefault();
            document
              .querySelectorAll(".nav-item[data-view]")
              .forEach((n) => n.classList.remove("is-active"));
            item.classList.add("is-active");
            if (item.getAttribute("href") === "#") {
              showToast(`${item.dataset.label} — coming soon in this preview.`);
            }
          });
        });

        document
          .querySelector(".nav-item.logout")
          .addEventListener("click", (e) => {
            e.preventDefault();
            showToast("Logged out.");
          });

        setupFilterDropdowns();
        document
          .getElementById("searchInput")
          .addEventListener("input", renderEvents);
        document.addEventListener("click", (e) => {
          const button = e.target.closest("[data-event-id]");
          if (button) openEventModal(button.dataset.eventId);
        });
        document.addEventListener("recovibeParticipationChanged", (event) => {
          const changed = EVENTS.find(
            (item) => String(item.id) === String(event.detail.eventId),
          );
          if (changed) changed.slotsOpen = event.detail.slotsOpen;
          renderEvents();
        });
        window.addEventListener("storage", (event) => {
          if (
            event.key !== participationStorageKey &&
            event.key !== "recovibeEventSlots"
          )
            return;
          EVENTS.forEach((item) => {
            item.slotsOpen = getEventSlots(item);
          });
          renderEvents();
        });
        document
          .getElementById("modalClose")
          .addEventListener("click", closeModal);
        document
          .getElementById("modalOverlay")
          .addEventListener("click", (e) => {
            if (e.target.id === "modalOverlay") closeModal();
          });
        document
          .getElementById("confirmClose")
          .addEventListener("click", closeConfirmModal);
        document
          .getElementById("confirmOverlay")
          .addEventListener("click", (e) => {
            if (e.target.id === "confirmOverlay") closeConfirmModal();
          });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            closeModal();
            closeConfirmModal();
          }
        });
        document
          .getElementById("confirmCancel")
          .addEventListener("click", () => {
            closeConfirmModal();
          });
        document
          .getElementById("confirmParticipate")
          .addEventListener("click", () => {
            const title =
              document.getElementById("confirmEventName").textContent;
            const participationIds = getParticipationIds();
            participationIds.add(selectedEventId);
            localStorage.setItem(
              participationStorageKey,
              JSON.stringify([...participationIds]),
            );
            closeConfirmModal();
            renderEvents();
            showToast(`You joined "${title}".`);
          });

        const requestedEventId = new URLSearchParams(
          window.location.search,
        ).get("event");
        if (
          requestedEventId &&
          EVENTS.some((event) => event.id === requestedEventId)
        ) {
          openEventModal(requestedEventId);
        }

        function showToast(message) {
          const toast = document.getElementById("toast");
          toast.textContent = message;
          toast.classList.add("is-visible");
          window.clearTimeout(showToast.timer);
          showToast.timer = window.setTimeout(
            () => toast.classList.remove("is-visible"),
            2400,
          );
        }
      })();
    </script>
  </body>
</html>
