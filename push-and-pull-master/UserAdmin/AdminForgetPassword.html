<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin portal - Reset password</title>
    <link rel="stylesheet" href="AdminForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="../UserStudent/Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Admin Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card">
          <a href="AdminLogin.html" class="back-link">&larr; Back to sign in</a>
          <h2>Reset your password</h2>
          <p class="sub">
            Enter the email on your admin account and we'll send a 6-digit
            verification code.
          </p>
          <div class="field">
            <label for="school-email">Email</label
            ><input
              type="email"
              id="school-email"
              placeholder="Enter your email address"
              autocomplete="email"
              inputmode="email"
              autocapitalize="none"
              spellcheck="false"
              maxlength="254"
              required
            />
          </div>
          <button type="button" class="btn-primary" id="send-code">
            Send code
          </button>
        </section>
      </main>
    </div>
    <script>
      document.getElementById("send-code").onclick = () =>
        (location.href = "AdminVerifyCode.html");
    </script>
  </body>
</html>
