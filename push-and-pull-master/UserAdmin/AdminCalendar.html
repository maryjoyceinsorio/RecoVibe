<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="google-calendar-api-key" content="YOUR_GOOGLE_CALENDAR_API_KEY" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Calendar · RecoVibe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="AdminCalendar.css" />
  </head>
  <body>
    <div class="admin-app">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="AdminDashboard.html"
          ><span class="admin-brand-mark">RV</span
          ><span
            ><strong>RECOVIBE</strong><small>PUP Biñan Campus</small></span
          ></a
        >
        <nav aria-label="Admin navigation">
          <a href="AdminDashboard.html"><b>▦</b>Dashboard</a
          ><a href="AdminAllEvents.html"><b>▤</b>All Events</a
          ><a href="AdminApproval.html"
            ><b>✓</b>Approval Queue<span
              class="admin-badge"
              data-queue-count
              hidden
            ></span></a
          ><a class="active" href="AdminCalendar.html"><b>▦</b>Calendar</a
          ><a href="AdminNotification.html"
            ><b>♧</b>Notifications<span
              class="admin-badge"
              data-notification-count
              hidden
            ></span></a
          ><a href="AdminProfile.html"><b>◉</b>Profile</a>
        </nav>
        <footer>
          <span class="admin-avatar" data-avatar>HA</span
          ><span class="admin-user"
            ><strong data-name>ADMIN</strong
            ><small data-role>Head of Academic Programs</small></span
          ><a
            class="admin-logout"
            href="AdminLogin.html"
            aria-label="Logout"
            title="Logout"
            >↪</a
          >
        </footer>
      </aside>
      <main class="admin-main">
        <header class="admin-page-heading">
          <div>
            <p class="admin-eyebrow">ADMINISTRATION</p>
            <h1>Calendar</h1>
          </div>
          <p class="admin-today">Today / <strong data-today></strong></p>
        </header>
        <section class="admin-content">
          <div id="calendarRoot" aria-live="polite">
            <div class="admin-loading">Loading calendar…</div>
          </div>
          <div
            class="admin-calendar-legend"
            id="calendarLegend"
            aria-label="Calendar legend"
          >
            <strong>Calendar legend</strong>
            <span class="admin-legend-item"><i class="admin-legend-dot dot-holiday"></i>Holiday</span>
            <span class="admin-legend-item"><i class="admin-legend-dot dot-academic"></i>Academic</span>
            <span class="admin-legend-item"><i class="admin-legend-dot dot-organization"></i>Organization</span>
            <span class="admin-legend-item"><i class="admin-legend-dot dot-institutional"></i>Institutional</span>
          </div>
        </section>
      </main>
    </div>
    <div class="admin-modal-host" id="calendarModalHost"></div>
    <div class="admin-toast" role="status" aria-live="polite" hidden></div>
    <script src="../UserStudent/events-data.js"></script>
    <script src="../EventDetailsModal.js"></script>
    <script type="module" src="AdminCalendar.js"></script>
  </body>
</html>
