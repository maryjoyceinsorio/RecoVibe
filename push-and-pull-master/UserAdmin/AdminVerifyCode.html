<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin portal - Verify email</title>
    <link rel="stylesheet" href="AdminForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="../UserStudent/Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Admin Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card">
          <a href="AdminForgetPassword.html" class="back-link"
            >&larr; Back to forgot password</a
          >
          <h2>Verify your email</h2>
          <p class="sub">
            Enter the 6-digit verification code we sent to your school email.
          </p>
          <p class="sub">johnd***@iskolarngbayan.pup.edu.ph</p>
          <div class="code-inputs" id="code-inputs">
            <input inputmode="numeric" maxlength="1" /><input
              inputmode="numeric"
              maxlength="1"
            /><input inputmode="numeric" maxlength="1" /><input
              inputmode="numeric"
              maxlength="1"
            /><input inputmode="numeric" maxlength="1" /><input
              inputmode="numeric"
              maxlength="1"
            />
          </div>
          <div class="code-help">
            <span>Didn't receive the code?</span
            ><button type="button" class="link-btn" id="resend-code">
              Resend code
            </button>
          </div>
          <button type="button" class="btn-primary" id="verify-code">
            Verify Code
          </button>
          <p class="countdown" id="countdown">Code expires in 05:00</p>
        </section>
      </main>
    </div>
    <script src="AdminForgotPassword.js"></script>
  </body>
</html>
