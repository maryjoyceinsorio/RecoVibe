<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="stylesheet" href="superadmin.css" />
    <link rel="stylesheet" href="systemsettings.css" />
  </head>
  <body class="system-settings-page">
    <div class="superadmin-app">
      <aside class="sidebar" aria-label="Super admin sidebar">
        <a class="brand" href="SuperAdminDashboard.html" aria-label="RecoVibe Super Admin home">
          <span class="brand-mark" aria-hidden="true">RV</span>
          <span class="brand-copy"><strong>RECOVIBE</strong><small>PUP Biñan Campus</small></span>
        </a>
        <nav class="primary-nav" aria-label="Primary navigation">
          <a class="nav-link" href="SuperAdminDashboard.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" /></svg>
            <span>Dashboard</span>
          </a>
          <a class="nav-link" href="SuperAdminAuditLogs.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8M9 3h6v3H9zM7 5H5v16h14V5h-2M8 11h8M8 15h8" /></svg>
            <span>Audit Logs</span>
          </a>
          <a class="nav-link" href="UserManagement.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3" /><path d="M3.5 20v-1.5a5.5 5.5 0 0 1 11 0V20zM16 5.5a3 3 0 0 1 0 5.8M17 14a5 5 0 0 1 3.5 4.8V20h-4" /></svg>
            <span>User Management</span>
          </a>
          <a class="nav-link is-active" href="SuperAdminSystemSettings.html" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="m19.4 15 .1.1 1.2 1-1.4 2.4-1.5-.6a8 8 0 0 1-1.5.9l-.3 1.6h-2.8l-.3-1.6a8 8 0 0 1-1.5-.9l-1.5.6-1.4-2.4 1.2-1a7 7 0 0 1 0-1.8l-1.2-1 1.4-2.4 1.5.6a8 8 0 0 1 1.5-.9l.3-1.6h2.8l.3 1.6a8 8 0 0 1 1.5.9l1.5-.6 1.4 2.4-1.2 1a7 7 0 0 1-.1 1.7Z" transform="translate(-1 -1)" /></svg>
            <span>System Settings</span>
          </a>
                    <a class="nav-link" href="SuperAdminActSum.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /><path d="M7 16V10M12 16V6M17 16V12" /></svg>
            <span>Activity Summary</span>
          </a>
          <a class="nav-link" href="SuperAdminNotifications.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
            <span>Notifications</span>
          </a>
          <a class="nav-link" href="SuperAdminProfile.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" /><path d="M4.5 20a7.5 7.5 0 0 1 15 0" /></svg>
            <span>Profile</span>
          </a>
        </nav>
        <footer class="sidebar-footer">
          <div class="account-summary">
            <span class="account-badge" aria-hidden="true">SA1</span>
            <span class="account-copy"><strong id="superadmin-name">JOSHUA ALEN LOPEZ</strong><small id="superadmin-role">Super Admin 1</small></span>
          </div>
          <a class="logout-link" href="SuperAdminLogin.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M13 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6" /></svg>
            <span>Logout</span>
          </a>
        </footer>
      </aside>

      <main class="main-content settings-main" id="main-content">
        <div class="settings-grid">
          <section class="settings-column" aria-labelledby="event-settings-heading">
            <h1 id="event-settings-heading">Event Settings</h1>
            <section class="setting-group" aria-labelledby="registration-settings-heading">
              <h2 id="registration-settings-heading">Registration Settings</h2>
              <label class="setting-control" for="toggle-registration">
                <span class="setting-toggle">
                  <input id="toggle-registration" type="checkbox" role="switch" checked />
                  <span class="switch-track" aria-hidden="true">
                    <span class="switch-thumb"></span>
                    <span class="switch-state on-state">On</span>
                    <span class="switch-state off-state">Off</span>
                  </span>
                </span>
                <span class="setting-label">Event Registration</span>
              </label>
            </section>

            <section class="settings-subsection" aria-labelledby="event-sources-heading">
              <h2 id="event-sources-heading">Event Sources</h2>
              <div class="setting-group settings-actions">
                <button class="settings-action-button" type="button" data-settings-action="sources-add">Add</button>
                <button class="settings-action-button" type="button" data-settings-action="sources-edit">Edit</button>
              </div>
            </section>

            <section class="settings-subsection" aria-labelledby="venues-heading">
              <h2 id="venues-heading">Venues</h2>
              <div class="setting-group settings-actions">
                <button class="settings-action-button" type="button" data-settings-action="venues-add">Add</button>
                <button class="settings-action-button" type="button" data-settings-action="venues-edit">Edit</button>
              </div>
            </section>
          </section>

          <section class="settings-column" aria-labelledby="system-access-heading">
            <h1 id="system-access-heading">System Access</h1>
            <section class="setting-group" aria-labelledby="user-login-heading">
              <h2 id="user-login-heading">User Login</h2>
              <label class="setting-control" for="toggle-login">
                <span class="setting-toggle">
                  <input id="toggle-login" type="checkbox" role="switch" checked />
                  <span class="switch-track" aria-hidden="true">
                    <span class="switch-thumb"></span>
                    <span class="switch-state on-state">On</span>
                    <span class="switch-state off-state">Off</span>
                  </span>
                </span>
                <span class="setting-label">User Entry</span>
              </label>
            </section>

            <section class="settings-subsection" aria-labelledby="event-categories-heading">
              <h2 id="event-categories-heading">Event Categories</h2>
              <div class="setting-group settings-actions">
                <button class="settings-action-button" type="button" data-settings-action="categories-add">Add</button>
                <button class="settings-action-button" type="button" data-settings-action="categories-edit">Edit</button>
              </div>
            </section>

            <section class="settings-subsection" aria-labelledby="organizations-heading">
              <h2 id="organizations-heading">Organizations</h2>
              <div class="setting-group settings-actions">
                <button class="settings-action-button" type="button" data-settings-action="organizations-add">Add</button>
                <button class="settings-action-button" type="button" data-settings-action="organizations-edit">Edit</button>
              </div>
            </section>
          </section>
        </div>
      </main>
    </div>
    <p class="settings-status" id="settings-status" role="status" aria-live="polite" hidden></p>
    <dialog class="settings-modal" id="settings-modal-backdrop" aria-labelledby="settings-modal-title">
      <form class="settings-modal-content" id="settings-modal-form">
        <div class="settings-modal-heading">
          <h2 id="settings-modal-title"></h2>
          <button class="settings-modal-close" type="button" data-close-settings aria-label="Close settings dialog">×</button>
        </div>
        <label class="settings-modal-field" id="settings-item-field" for="settings-item-input">
          <span id="settings-item-label"></span>
          <input id="settings-item-input" name="item" type="text" maxlength="120" autocomplete="off" />
        </label>
        <ul class="settings-item-list" id="settings-item-list" aria-label="Existing items" hidden></ul>
        <div class="settings-modal-actions">
          <button class="settings-modal-button secondary" type="button" data-close-settings>Close</button>
          <button class="settings-modal-button primary" id="settings-item-submit" type="submit">Add</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="superAdminGuard.js"></script>
    <script type="module" src="systemSettings.js"></script>
  </body>
</html>
