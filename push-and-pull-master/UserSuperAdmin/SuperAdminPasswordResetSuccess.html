<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Super Admin portal - Password reset complete</title>
    <link rel="stylesheet" href="SuperAdminForgotPassword.css" />
  </head>
  <body>
    <div class="screen">
      <div class="side">
        <img
          src="../UserStudent/Picture/PUPLogo-removebg-preview.png"
          class="mark"
          alt="RecoVibe logo"
        />
        <div>
          <h1>RecoVibe Super Admin Portal</h1>
          <p class="tagline">University, Organization, and Seminar Events.</p>
        </div>
      </div>
      <main class="main">
        <section class="card flow-card success-card">
          <div class="success-icon">&#10003;</div>
          <h2>Password successfully changed</h2>
          <p class="sub">
            Your password has been updated successfully. You can now sign in
            using your new password.
          </p>
          <a
            href="SuperAdminLogin.html"
            class="btn-primary"
            style="display: block; text-align: center; text-decoration: none"
            >Back to Login</a
          >
        </section>
      </main>
    </div>
  </body>
</html>
